name: Multilingual docs

on:
  pull_request:
    paths:
      - '.github/workflows/i18n.yml'
      - '.i18n/**'
      - '.mintignore'
      - 'AGENTS.md'
      - 'docs.json'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.mdx'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/i18n.yml'
      - '.i18n/**'
      - '.mintignore'
      - 'AGENTS.md'
      - 'docs.json'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.mdx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check docs locale contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install lockfile-pinned Mint CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test docs locale guard
        run: node --test .i18n/*.test.mjs

      - name: Validate multilingual docs exposure
        run: node .i18n/check.mjs

      - name: Check stage-derived deploy config
        run: node .i18n/deploy-config.mjs check

      - name: Build isolated Spanish review projection
        run: node .i18n/preview.mjs --output /tmp/paperzilla-docs-es-run7-review --replace

      - name: Validate approved production docs
        run: |
          node .i18n/artifact-guard.mjs assert-deployable --root .
          npm run mint:validate
          npm run mint:broken-links

      - name: Validate future bilingual review projection
        run: |
          cd /tmp/paperzilla-docs-es-run7-review
          node "$GITHUB_WORKSPACE/.i18n/artifact-guard.mjs" assert-non-promotable --root .
          "$GITHUB_WORKSPACE/node_modules/.bin/mint" validate
          "$GITHUB_WORKSPACE/node_modules/.bin/mint" broken-links
